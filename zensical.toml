[project]
site_name = "The Dutch Mobility Triangle"
# Required for instant navigation. Set to your GitHub Pages URL, e.g.
# https://<username>.github.io/dutch-report/  — leave the trailing slash.
site_url = "https://hcoco1.github.io/dutch-report/"
site_description = "A spatial analysis of the multimodal environment around Dutch railway stations."
site_author = "Ivan Arias"
copyright = "Copyright &copy; 2026 Ivan Arias"

# Uncomment to add a repository link in the header:
# repo_url = "https://github.com/hcoco1/dutch-report"
# repo_name = "<username>/dutch-report"

nav = [
  { "Overview" = "index.md" },
  { "1. Introduction" = "introduction.md" },
  { "2. Literature review" = "literature-review.md" },
  { "3. Data" = "data.md" },
  { "4. Methodology" = "methodology.md" },
  { "5. Results" = "results.md" },
  { "6. Discussion" = "discussion.md" },
  { "7. Conclusions" = "conclusions.md" },
  { "8. References" = "references.md" },
  { "Appendices" = "appendices.md" },
  { "Project plan" = "project-plan.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"

features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.code.annotate",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# Light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# --- Standard rendering set. Enables admonitions, footnotes, tables, task
# --- lists, math, code highlighting, tabs, and emoji. No need to edit.
[project.markdown_extensions]
pymdownx.highlight.linenums = true
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}